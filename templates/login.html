<!DOCTYPE html>
<html>
<head>
    <title>FeelBuddy — Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e0f0ff 0%, #f3e8ff 50%, #fce4ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 28px;
            padding: 36px 32px;
            width: 420px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #5c8df6;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .role-select {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .role-btn {
            flex: 1;
            padding: 10px 8px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #888;
            transition: all 0.2s;
            text-align: center;
        }

        .role-btn.active {
            border-color: #5c8df6;
            background: #e8f0fe;
            color: #5c8df6;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #555;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            font-size: 15px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            outline: none;
            transition: border 0.2s;
        }

        .form-group input:focus { border-color: #5c8df6; }

        .family-code-box { display: none; }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #5c8df6, #7c6ff7);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(92,141,246,0.4);
        }

        .msg {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            font-weight: 700;
            min-height: 20px;
        }

        .msg.success { color: #43a047; }
        .msg.error   { color: #e53935; }

        .family-code-display {
            display: none;
            background: #e8f5e9;
            border: 2px solid #66bb6a;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-top: 14px;
        }

        .family-code-display p {
            font-size: 13px;
            color: #388e3c;
            font-weight: 700;
        }

        .family-code-display .code {
            font-size: 28px;
            font-weight: 800;
            color: #2e7d32;
            letter-spacing: 4px;
            margin: 6px 0;
        }

        .bottom-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #888;
            font-weight: 600;
        }

        .bottom-link a {
            color: #5c8df6;
            text-decoration: none;
            font-weight: 800;
        }

        /* Login form inside register page */
        .login-section {
            display: none;
        }

        .back-btn {
            background: none;
            border: none;
            color: #5c8df6;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 16px;
            padding: 0;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #5c8df6, #7c6ff7);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(92,141,246,0.4);
        }
    </style>
</head>
<body>

<div class="card">

    <!-- ── REGISTER SECTION ── -->
    <div id="register-section">
        <div class="logo">💛 FeelBuddy</div>
        <div class="subtitle">Create your account</div>

        <div class="role-select">
            <div class="role-btn active" onclick="selectRole('child')" id="btn-child">🧒 Child</div>
            <div class="role-btn" onclick="selectRole('parent')" id="btn-parent">👨‍👩‍👧 Parent</div>
            <div class="role-btn" onclick="selectRole('therapist')" id="btn-therapist">👩‍⚕️ Therapist</div>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="reg-name" placeholder="Enter your full name...">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="reg-email" placeholder="Enter your email address...">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="Create a password...">
        </div>

        <div class="form-group family-code-box" id="family-code-box">
            <label>Family Code <span style="color:#e53935">*</span></label>
            <input type="text" id="family-code" placeholder="Enter child's family code..." style="text-transform:uppercase; letter-spacing:3px;">
        </div>

        <button class="btn-register" onclick="doRegister()">Create Account 🚀</button>

        <div class="msg" id="reg-msg"></div>

        <div class="family-code-display" id="code-display">
            <p>🎉 Your Family Code is:</p>
            <div class="code" id="code-text"></div>
            <p>Share this code with your parent or therapist!</p>
        </div>

        <div class="bottom-link">
            Already have an account? <a href="#" onclick="showLogin()">Login here</a>
        </div>
    </div>

    <!-- ── LOGIN SECTION ── -->
    <div id="login-section" style="display:none;">
        <button class="back-btn" onclick="showRegister()">← Back</button>
        <div class="logo">💛 FeelBuddy</div>
        <div class="subtitle" style="margin-bottom:24px;">Welcome back! Sign in to continue</div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="Enter your email..."
                onkeypress="if(event.key==='Enter') doLogin()">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="Enter your password..."
                onkeypress="if(event.key==='Enter') doLogin()">
        </div>

        <button class="btn-login" onclick="doLogin()">Login →</button>

        <div class="msg" id="login-msg"></div>

        <div class="bottom-link">
            New here? <a href="#" onclick="showRegister()">Create an account</a>
        </div>
    </div>

</div>

<script>
    let selectedRole = "child";

    function selectRole(role) {
        selectedRole = role;
        document.querySelectorAll(".role-btn").forEach(b => b.classList.remove("active"));
        document.getElementById("btn-" + role).classList.add("active");
        let fcBox = document.getElementById("family-code-box");
        fcBox.style.display = (role === "parent" || role === "therapist") ? "block" : "none";
    }

    function showLogin() {
        document.getElementById("register-section").style.display = "none";
        document.getElementById("login-section").style.display = "block";
        document.getElementById("login-msg").textContent = "";
    }

    function showRegister() {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("register-section").style.display = "block";
        document.getElementById("reg-msg").textContent = "";
    }

    function doRegister() {
        let name       = document.getElementById("reg-name").value.trim();
        let email      = document.getElementById("reg-email").value.trim();
        let password   = document.getElementById("reg-password").value.trim();
        let role       = selectedRole;
        let familyCode = document.getElementById("family-code").value.trim();
        let msg        = document.getElementById("reg-msg");

        if (!name || !email || !password) {
            msg.textContent = "⚠️ Please fill in all fields!";
            msg.className = "msg error";
            return;
        }

        fetch("/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password, role, family_code: familyCode })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                msg.textContent = "✅ " + data.message;
                msg.className = "msg success";
                if (data.role === "child" && data.family_code) {
                    document.getElementById("code-text").textContent = data.family_code;
                    document.getElementById("code-display").style.display = "block";
                } else {
                    setTimeout(() => showLogin(), 1500);
                }
            } else {
                msg.textContent = "❌ " + data.message;
                msg.className = "msg error";
            }
        })
        .catch(() => {
            msg.textContent = "❌ Something went wrong. Please try again!";
            msg.className = "msg error";
        });
    }

    function doLogin() {
        let email    = document.getElementById("login-email").value.trim();
        let password = document.getElementById("login-password").value.trim();
        let msg      = document.getElementById("login-msg");

        if (!email || !password) {
            msg.textContent = "⚠️ Please enter email and password!";
            msg.className = "msg error";
            return;
        }

        msg.textContent = "⏳ Logging in...";
        msg.className = "msg";

        fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                msg.textContent = "✅ Login successful!";
                msg.className = "msg success";
                setTimeout(() => window.location.href = data.redirect, 800);
            } else {
                msg.textContent = "❌ " + data.message;
                msg.className = "msg error";
            }
        })
        .catch(() => {
            msg.textContent = "❌ Something went wrong. Try again!";
            msg.className = "msg error";
        });
    }

    // Auto show login if URL has ?login=true
    if (window.location.search.includes("login=true")) {
        showLogin();
    }
</script>

</body>
</html>
